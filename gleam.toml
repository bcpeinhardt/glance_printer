name = "glance_printer"
version = "3.0.0"
description = "A pretty_printer for the glance AST"
gleam = ">= 1.4.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
licences = ["Apache-2.0"]
repository = { type = "github", user = "bcpeinhardt", repo = "glance_printer" }
# links = [{ title = "Website", href = "https://gleam.run" }]

[dependencies]
gleam_stdlib = "~> 0.62.1 or ~> 1.0"
glance = ">= 5.0.0 and < 6.0.0"
glam = "~> 1.0 or ~> 2.0"

[dev-dependencies]
simplifile = "~> 2.3.0"
testbldr = { git = "git@github.com:bchase/testbldr.git", ref = "upgrade-deps" }
